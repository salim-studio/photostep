<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

    <!-- Disable zooming: -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title>PhotoStep — fast image editor in Rust</title>
    <meta name="description" content="PhotoStep: fast layer-based image editor in pure Rust. Try it right in your browser. © 2026 salim-slimani.">
    <meta name="author" content="salim-slimani">
    <meta name="copyright" content="© 2026 salim-slimani. All rights reserved.">

    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14142B">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            background: #14142B;
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        .brand {
            color: #FF5A28;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #FF5A28 transparent #FF5A28 transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- The WASM module resizes the canvas dynamically -->
    <!-- the id is hardcoded in src/main.rs, so make sure both match. -->
    <canvas id="the_canvas_id"></canvas>

    <!-- removed by src/main.rs once the app boots -->
    <div class="centered" id="loading_text">
        <noscript>You need JavaScript to run PhotoStep in your browser</noscript>
        <img src="assets/logo.svg" width="96" height="96" alt="PhotoStep logo" />
        <p class="brand">PHOTOSTEP</p>
        <p style="font-size:16px">
            Loading…
        </p>
        <div class="lds-dual-ring"></div>
    </div>

    <!-- photostep.js / photostep_bg.wasm are generated by wasm-bindgen (see vercel.json) -->
    <script type="module">
        import init from './photostep.js';
        try {
            await init();
        } catch (err) {
            document.getElementById('loading_text').innerHTML =
                '<p>The app failed to start. See the developer console for details.</p>';
            throw err;
        }
    </script>
</body>

</html>
