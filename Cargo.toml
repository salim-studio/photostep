[package]
name = "photostep"
version = "0.1.0"
edition = "2021"
description = "PhotoStep — fast layer-based image editor in pure Rust"
authors = ["salim-slimani"]
license = "MIT"
homepage = "https://github.com/salim-studio/photostep"
repository = "https://github.com/salim-studio/photostep"

[[bin]]
name = "photostep"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.32"
image = { version = "0.25", features = ["png", "jpeg", "tiff", "bmp", "tga", "webp", "gif", "qoi"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rfd = "0.15"
anyhow = "1"
