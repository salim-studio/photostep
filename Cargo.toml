[package]
name = "photostep"
version = "0.2.1"
edition = "2021"
description = "PhotoStep — fast layer-based image editor in pure Rust"
authors = ["salim-slimani"]
license = "MIT"
homepage = "https://github.com/salim-studio/photostep"
repository = "https://github.com/salim-studio/photostep"

[[bin]]
name = "photostep"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.32"
image = { version = "0.25", features = ["png", "jpeg", "tiff", "bmp", "tga", "webp", "gif", "qoi"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
psd = "0.3"
kamadak-exif = "0.5"

# native-only: blocking file dialogs (the web build uses a placeholder message)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.15"

# web-only: WASM bindings to boot the egui app in the browser canvas
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
